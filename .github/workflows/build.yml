name: 🏗️ Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  
env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.9'

jobs:
  build-macos:
    name: 🍎 Build macOS
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install npm dependencies
        run: npm ci
      
      - name: Verify npm dependencies (macOS)
        run: |
          echo "Node version:" && node --version
          echo "npm version:" && npm --version
          echo "electron-builder version:" && npx electron-builder --version
          echo "npm list electron:" && npm list electron 2>/dev/null || true
          echo "npm list electron-builder:" && npm list electron-builder 2>/dev/null || true
      
      - name: Install PyInstaller
        run: pip install pyinstaller
      
      - name: Bundle Python backend
        run: npm run python:bundle
        
      - name: List build artifacts
        run: ls -lah pybuild/dist/ 2>/dev/null || echo "No pybuild/dist yet"
      
      - name: Verify Python bundle exists
        run: test -f pybuild/dist/convert && echo "✅ Python bundle exists" || echo "❌ Python bundle missing"
      
      - name: Build macOS (${{ matrix.arch }})
        env:
          DEBUG: "electron-builder*"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac --${{ matrix.arch }} 2>&1 | tee build-output.log
      
      - name: Apply entitlements with ad-hoc code signing
        if: always()
        run: |
          echo "🔐 Applying entitlements to macOS app..."
          # electron-builder creates app in ./release/mac-{arch}/ directory structure
          APP_BUNDLE=$(find ./release -maxdepth 2 -name "Embroidery*.app" -o -name "*.app" | head -1)
          if [ -z "$APP_BUNDLE" ]; then
            echo "❌ No .app bundle found, searching for all directories..."
            find ./release -type d | head -20
            exit 1
          fi
          echo "✓ Found app bundle: $APP_BUNDLE"
          chmod +x scripts/apply-entitlements.sh
          scripts/apply-entitlements.sh "$APP_BUNDLE" "build/entitlements.mac.plist" || true
      
      - name: Save build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-macos-${{ matrix.arch }}
          path: build-output.log
          retention-days: 7
          if-no-files-found: warn
      
      - name: List release artifacts
        run: ls -lah release/ || echo "No release folder"
      
      - name: Find DMG files
        id: find_dmg
        run: |
          find release -name "*.dmg" -type f || true
          dmg_file=$(find release -name "*.dmg" -type f | head -1 || true)
          if [ -n "$dmg_file" ]; then
            echo "dmg_file=$dmg_file" >> $GITHUB_OUTPUT
            echo "✅ Found DMG: $dmg_file"
          else
            echo "⚠️ No DMG file found"
          fi
      
      - name: Upload macOS artifact
        if: steps.find_dmg.outputs.dmg_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: embroidery-converter-macos-${{ matrix.arch }}
          path: ${{ steps.find_dmg.outputs.dmg_file }}
          retention-days: 30
          if-no-files-found: warn

  build-windows:
    name: 🪟 Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install NSIS
        run: choco install nsis -y
      
      - name: Install npm dependencies
        run: npm ci
      
      - name: Verify npm dependencies (Windows)
        run: |
          Write-Host "Node version:" ; node --version
          Write-Host "npm version:" ; npm --version
          Write-Host "electron-builder version:" ; npx electron-builder --version
          Write-Host "npm list electron:" ; npm list electron 2>$null || Write-Host "Not found"
          Write-Host "npm list electron-builder:" ; npm list electron-builder 2>$null || Write-Host "Not found"
      
      - name: Install PyInstaller
        run: pip install pyinstaller
      
      - name: Bundle Python backend
        run: npm run python:bundle
        
      - name: Verify Python bundle exists
        run: |
          if (Test-Path "pybuild\dist\convert.exe") {
            Write-Host "✅ Python bundle exists"
            dir pybuild\dist\convert.exe
          } else {
            Write-Host "❌ ERROR: Python bundle missing! Expected pybuild\dist\convert.exe"
            Write-Host "Contents of pybuild\dist:"
            if (Test-Path "pybuild\dist") {
              dir pybuild\dist
            } else {
              Write-Host "pybuild\dist directory does not exist"
            }
            exit 1
          }
      
      - name: Verify Python bundle exists
        run: |
          Write-Host "=== Checking PyInstaller output ==="
          if (Test-Path "pybuild\dist\convert.exe") {
            Write-Host "✅ Python bundle exists"
            dir pybuild\dist\convert.exe
          } else {
            Write-Host "❌ ERROR: Python bundle missing! Expected pybuild\dist\convert.exe"
            Write-Host "Contents of pybuild\dist:"
            if (Test-Path "pybuild\dist") {
              dir pybuild\dist
            } else {
              Write-Host "pybuild\dist directory does not exist"
            }
            exit 1
          }
      
      - name: Build Windows
        env:
          DEBUG: "electron-builder*"
        run: |
          Write-Host "Starting electron-builder for Windows..."
          npx electron-builder --win --x64 2>&1 | Tee-Object -FilePath build-output.log
          $exitCode = $LASTEXITCODE
          Write-Host "electron-builder exit code: $exitCode"
          if ($exitCode -ne 0) {
            Write-Host "❌ electron-builder FAILED with exit code $exitCode"
            exit $exitCode
          }
          Write-Host "✅ electron-builder succeeded"
      
      - name: List release folder immediately after build
        if: always()
        run: |
          Write-Host "=== Release folder contents immediately after build ==="
          if (Test-Path "release") {
            Get-ChildItem -Path release -Recurse | ForEach-Object {
              $type = if ($_.PSIsContainer) { "[DIR]" } else { "[FILE]" }
              Write-Host "$($_.FullName) $type"
            }
          } else {
            Write-Host "release folder does not exist"
          }
      
      - name: Find all .exe files (any location)
        if: always()
        run: |
          Write-Host "=== Searching for ALL .exe files ==="
          Get-ChildItem -Recurse -Include "*.exe" -File 2>$null | ForEach-Object {
            Write-Host "$($_.FullName) ($([Math]::Round($_.Length/1MB, 2))MB)"
          }
      
      - name: Verify Windows build output
        run: |
          Write-Host "=== Verifying build output ==="
          if (Test-Path "release") {
            $exeFiles = Get-ChildItem -Path release -Recurse -Include "*.exe" -File
            if ($exeFiles) {
              Write-Host "✅ Found $($exeFiles.Count) .exe file(s):"
              $exeFiles | ForEach-Object { Write-Host "  - $($_.FullName)" }
            } else {
              Write-Host "❌ ERROR: No .exe files found in release folder!"
              Write-Host "Release folder contents:"
              Get-ChildItem -Path release -Recurse | ForEach-Object {
                $type = if ($_.PSIsContainer) { "DIR" } else { "FILE" }
                Write-Host "  $($_.FullName) [$type]"
              }
              exit 1
            }
          } else {
            Write-Host "❌ ERROR: release folder does not exist!"
            exit 1
          }
      
      - name: Save build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-windows
          path: build-output.log
          retention-days: 7
          if-no-files-found: warn
      
      - name: Debug - Check Python bundle
        if: always()
        run: |
          Write-Host "=== Checking Python bundle ==="
          dir pybuild\dist 2>$null || Write-Host "No pybuild\dist found"
      
      - name: Debug - Check release folder
        if: always()
        run: |
          Write-Host "=== Checking release folder ==="
          dir release 2>$null || Write-Host "No release folder found"
          Write-Host ""
          Write-Host "=== All .exe files ==="
          Get-ChildItem -Recurse -Include "*.exe" 2>$null | ForEach-Object { Write-Host $_.FullName }
      
      - name: Find EXE file
        id: find_exe
        run: |
          Write-Host "=== Searching for NSIS Installer ==="
          # First try to find NSIS installer (Setup*.exe or *Setup*.exe)
          $installerFiles = @(Get-ChildItem -Path release -File -Recurse -Include "*Setup*.exe", "*setup*.exe" -ErrorAction SilentlyContinue)
          
          if ($installerFiles.Count -gt 0) {
            # Use the largest one if multiple found
            $exeFile = $installerFiles | Sort-Object -Property Length -Descending | Select-Object -First 1
            Write-Host "✅ NSIS Installer found: $($exeFile.FullName)"
            Write-Host "  Size: $([Math]::Round($exeFile.Length/1MB, 2))MB"
            
            "exe_file=$($exeFile.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "exe_found=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            Write-Host "⚠️  No NSIS installer found, searching for any .exe file..."
            $exeFiles = @(Get-ChildItem -Path release -File -Recurse -Include "*.exe" -ErrorAction SilentlyContinue)
            Write-Host "Found $($exeFiles.Count) .exe file(s)"
            
            if ($exeFiles.Count -gt 0) {
              # Use the largest .exe file (installer is larger than raw executable)
              $exeFile = $exeFiles | Sort-Object -Property Length -Descending | Select-Object -First 1
              Write-Host "✅ Largest EXE found: $($exeFile.FullName)"
              Write-Host "  Size: $([Math]::Round($exeFile.Length/1MB, 2))MB"
              
              "exe_file=$($exeFile.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              "exe_found=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            } else {
              Write-Host "❌ No .exe file found in release folder!"
              Write-Host "Release folder contents:"
              if (Test-Path "release") {
                Get-ChildItem -Path release -Recurse -File | ForEach-Object {
                  Write-Host "  - $($_.FullName) ($([Math]::Round($_.Length/1MB, 2))MB)"
                }
              }
              "exe_found=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              exit 1
            }
          }
      
      - name: Upload Windows artifact
        if: steps.find_exe.outputs.exe_found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: embroidery-converter-windows
          path: ${{ steps.find_exe.outputs.exe_file }}
          retention-days: 30
          if-no-files-found: error

  create-release:
    name: 📢 Create Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-artifacts
      
      - name: Keep and list release assets
        run: |
          find release-artifacts -type f ! \( -name "*.dmg" -o -name "*.exe" \) -delete
          find release-artifacts -type f \( -name "*.dmg" -o -name "*.exe" \) -exec ls -lah {} +
      
      - name: Debug - Check token availability
        run: |
          if [ -z "${{ secrets.GH_TOKEN }}" ]; then
            echo "⚠️ WARNING: GH_TOKEN secret is empty or not set!"
            echo "Using fallback: GITHUB_TOKEN"
          else
            echo "✅ GH_TOKEN secret is available"
          fi
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release-artifacts/**/*.dmg
            release-artifacts/**/*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
          token: ${{ secrets.GH_TOKEN || github.token }}
