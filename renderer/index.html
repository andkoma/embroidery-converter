<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>Embroidery Converter</title>
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/shell.css" />
</head>
<body>
  <div class="app">
    <!-- Header (app-wide) -->
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 12c4-6 12-6 16 0"/>
            <path d="M4 12c4 6 12 6 16 0"/>
            <circle cx="4" cy="12" r="1.4" fill="currentColor" stroke="none"/>
            <circle cx="20" cy="12" r="1.4" fill="currentColor" stroke="none"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Embroidery Converter</h1>
          <span class="subtitle" data-i18n="app.subtitle">Convert stitch files between machine formats</span>
        </div>
      </div>
      <div class="topbar-right">
        <div class="lang-select" title="Language / Sprache / Langue">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"/><path d="M3 12h18"/>
            <path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"/>
          </svg>
          <select id="langSelect" aria-label="Language">
            <option value="en">English</option>
            <option value="de">Deutsch</option>
            <option value="fr">Français</option>
          </select>
        </div>
        <div class="backend-badge" id="backendBadge" title="Backend status">
          <span class="dot"></span><span id="backendLabel" data-i18n="backend.checking">Checking backend…</span>
        </div>
      </div>
    </header>

    <div class="shell">
      <!-- Left navigation rail -->
      <nav class="nav-rail">
        <!-- Nav items -->
      <div class="nav-items">
        <button class="nav-item active" data-view="convert">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 16V4"/>
            <path d="M7 9l5-5 5 5"/>
            <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
          </svg>
          <span class="nav-item-label" data-i18n="nav.convert">Convert</span>
        </button>

        <button class="nav-item" data-view="batch">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3h7v7H3z"/>
            <path d="M14 3h7v7h-7z"/>
            <path d="M14 14h7v7h-7z"/>
            <path d="M3 14h7v7H3z"/>
          </svg>
          <span class="nav-item-label" data-i18n="nav.batch">Batch</span>
        </button>

        <button class="nav-item" data-view="gallery">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <path d="M21 15l-5-5L5 21"/>
          </svg>
          <span class="nav-item-label" data-i18n="nav.gallery">Gallery</span>
        </button>

        <button class="nav-item" data-view="simulator">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <polygon points="10 8 16 12 10 16 10 8"/>
          </svg>
          <span class="nav-item-label" data-i18n="nav.simulator">Simulator</span>
        </button>

        <button class="nav-item" data-view="transfer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 20H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v4"/>
            <path d="M22 18l-4-4-4 4"/>
            <path d="M18 22v-8"/>
          </svg>
          <span class="nav-item-label" data-i18n="nav.transfer">Transfer</span>
        </button>
      </div>
    </nav>

      <!-- Main view area -->
      <div id="viewHost" class="view-host">
        <div class="view-loading">Loading...</div>
      </div>
    </div>

    <!-- Footer (app-wide) -->
    <div class="copyright-bar">
      © 2026 <a href="https://orgware.ai" target="_blank">orgware.ai</a> &nbsp;·&nbsp;
      <a href="mailto:andkoma@akopp.de">andkoma@akopp.de</a> &nbsp;·&nbsp;
      <span class="ai-notice" title="In accordance with EU AI Act transparency requirements">Created with AI support</span>
    </div>
  </div>

  <!-- Core scripts (load before views) -->
  <script src="i18n.js"></script>
  <script src="core/store.js"></script>
  <script src="core/router.js"></script>
  <script src="core/api.js"></script>
  
  <!-- Shell initialization -->
  <script src="shell.js"></script>
</body>
</html>
